main: net.tfminecraft.interactiblefurniture.InteractibleFurniture
api-version: '1.21.10'
name: InteractibleFurniture
version: ${project.version}
author: Drefvelin

depend: [TLibs, MythicMobs]

commands:
  if:
    description: InteractibleFurniture admin commands
    usage: /if reload | /if nested attach | /if nested detach | /if debug <on|off>

permissions:
  interactiblefurniture.reload:
    description: Reload furniture and sound configs
    default: op
  interactiblefurniture.debug:
    description: Toggle furniture interaction debug particles
    default: op